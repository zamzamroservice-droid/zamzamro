# On every push to main:
#   1. Photos dropped into new-photos/<category>/<product>/ are resized, become that product's first
#      image and are committed back to main (see new-photos/README.md and scripts/ingest-photos.mjs).
#   2. The site is built (type-check + Vite + per-route SEO).
#   3. If CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets are set, it deploys to Cloudflare Workers.
#      (If the Cloudflare project is instead connected to this repo with Workers Builds, Cloudflare
#      deploys by itself when the photo commit lands — no secrets needed.)
name: Photos & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos-and-deploy
  cancel-in-progress: false

jobs:
  photos-build-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Process new product photos
        id: photos
        run: node scripts/ingest-photos.mjs

      - name: Commit processed photos to main
        if: steps.photos.outputs.added != '0'
        run: |
          git config user.name "zamzam-photo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images/uploads src/data/photo-uploads.json new-photos
          git commit -m "Add ${{ steps.photos.outputs.added }} product photo(s) from new-photos"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
